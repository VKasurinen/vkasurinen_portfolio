name: Deploy to vkasurinen.dev

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 46.62.157.195 >> ~/.ssh/known_hosts

      - name: Copy build to server
        run: rsync -avz --delete build/ admin@46.62.157.195:/opt/portfolio/

      - name: Check site responds
        run: curl -fsS -o /dev/null https://vkasurinen.dev
